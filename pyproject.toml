[project]
  authors = [{ name = "Paul Razvan Berg" }]
  dependencies = [
    "python-dotenv>=1.2.4",
  ]
  description = "Add your description here"
  name = "uv-template"
  readme = "README.md"
  requires-python = ">=3.14"
  version = "0.1.0"

[dependency-groups]
  dev = [
    "pyright>=1.1.414,<2",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0,<1",
  ]

[tool.pytest.ini_options]
  cache_dir = ".cache/pytest"
  pythonpath = ["."]
  testpaths = ["tests"]
