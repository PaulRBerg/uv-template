[project]
  authors = [{ name = "Paul Razvan Berg" }]
  dependencies = [
    "python-dotenv>=1.0",
  ]
  description = "Add your description here"
  name = "uv-template"
  readme = "README.md"
  requires-python = ">=3.13"
