[build-system]
  build-backend = "hatchling.build"
  requires = ["hatchling"]

[project]
  authors = [{ name = "Paul Razvan Berg" }]
  dependencies = [
    "python-dotenv>=1.0",
  ]
  description = "Add your description here"
  name = "uv-template"
  readme = "README.md"
  requires-python = ">=3.12"
  version = "0.1.0"

[project.optional-dependencies]
  dev = [
    "pyright>=1.1",
    "pytest>=8.0",
    "ruff>=0.8",
  ]

[tool.pytest.ini_options]
  pythonpath = ["."]
  testpaths = ["tests"]

[tool.uv]
  package = false
